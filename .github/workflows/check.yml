name: Проверка приложения
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: pip install -r requirements-build.txt
      - name: Проверить готовые файлы публикации
        run: |
          python tools/build.py
          git diff --exit-code -- src/config.js assets/app-qr.png sw.js version.json
          test -f .nojekyll
